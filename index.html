<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flexbox - flex-wrap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành thuộc tính flex-wrap trong CSS Flexbox</h1>

    <div class="demo-section">
        <h2>Khối thử nghiệm Flex Container (Width: 600px)</h2>
        <p>Thử thay đổi thuộc tính <code>flex-wrap</code> trong file CSS để quan sát vị trí các thẻ Item.</p>

        <!-- Container kiểm tra flex-wrap -->
        <div class="container">
            <div class="item">Item 1</div>
            <div class="item">Item 2</div>
            <div class="item">Item 3</div>
            <div class="item">Item 4</div>
            <div class="item">Item 5</div>
            <div class="item">Item 6</div>
        </div>
    </div>

</body>
</html>
